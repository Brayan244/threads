<text x="354" y="309" class="label">The runtime supplies the session ID for each call.</text>
<text x="354" y="339" class="label">A new conversation changes that ID, not the existing history.</text>
<text x="354" y="386" class="tiny quiet">▸  Record data and exact attribution</text>
